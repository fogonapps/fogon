<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Logo de Fogón</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&amp;family=Anton&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tinta{filter:url(#tinta)}
</style>
</helmet>
<div style="width: 1200px; height: 760px; position: relative; overflow: hidden; display: grid; grid-template-rows: minmax(0, 1fr) 260px; background: #EFE7DA; color: #141210">
  <svg width="0" height="0" aria-hidden="true" style="position: absolute"><defs><filter id="tinta" x="-10%" y="-20%" width="120%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="10"></feDisplacementMap><feGaussianBlur stdDeviation="1.6"></feGaussianBlur><feComponentTransfer><feFuncA type="linear" slope="14" intercept="-6"></feFuncA></feComponentTransfer></filter><filter id="mancha" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="44"></feDisplacementMap><feGaussianBlur stdDeviation="3"></feGaussianBlur><feComponentTransfer><feFuncA type="linear" slope="10" intercept="-4"></feFuncA></feComponentTransfer></filter><filter id="grano"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></defs></svg>
  <div style="position: relative; display: flex; align-items: center; justify-content: center">
    <svg width="1200" height="500" aria-hidden="true" style="position: absolute; inset: 0; mix-blend-mode: multiply"><g filter="url(#mancha)" fill="{{mancha}}"><ellipse cx="660" cy="280" rx="220" ry="165"></ellipse></g></svg>
    <div class="tinta" role="img" aria-label="fogón" style="position: relative; mix-blend-mode: multiply; font-family: 'Bagel Fat One', system-ui, sans-serif; font-size: 230px; line-height: 1; letter-spacing: -0.02em; color: #141210">fog<span style="position: relative; display: inline-block">o<svg viewBox="-50 -50 100 100" aria-hidden="true" style="position: absolute; left: 50%; top: 0.0em; width: 0.36em; height: 0.36em; transform: translateX(-44%) rotate(8deg)"><path fill="#E5332A" d="M0 -50Q5 -5 50 0Q5 5 0 50Q-5 5 -50 0Q-5 -5 0 -50Z"></path></svg></span>n</div>
  </div>
  <div style="position: relative; background: #141210; color: #EFE7DA; display: flex; align-items: center; justify-content: space-between; gap: 40px; padding: 0 64px">
    <div class="tinta" role="img" aria-label="fogón" style="font-family: 'Bagel Fat One', system-ui, sans-serif; font-size: 120px; line-height: 1; color: #EFE7DA">fog<span style="position: relative; display: inline-block">o<svg viewBox="-50 -50 100 100" aria-hidden="true" style="position: absolute; left: 50%; top: 0.0em; width: 0.36em; height: 0.36em; transform: translateX(-44%) rotate(8deg)"><path fill="#E5332A" d="M0 -50Q5 -5 50 0Q5 5 0 50Q-5 5 -50 0Q-5 -5 0 -50Z"></path></svg></span>n</div>
    <div class="tinta" style="font-family: 'Anton', system-ui, sans-serif; font-size: 46px; line-height: 0.95; text-transform: uppercase; color: #FF4FA3; max-width: 430px; text-align: right">Tu atención vale más que un anuncio</div>
  </div>
  <svg width="1200" height="760" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: 0.22"><rect width="1200" height="760" filter="url(#grano)"></rect></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mancha":{"editor":"color","options":["#FFC93C","#FF4FA3","#2D5BFF","#1FB45A"],"default":"#FFC93C"},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return { mancha: this.props.mancha ?? '#FFC93C' };
  }
}
</script>
</body>
</html>
